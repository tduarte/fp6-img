# libcamera softISP tuning for the Fairphone 6 main camera (Sony IMX896).
#
# Ported to the libcamera 0.8.0 softisp IPA (libipa Awb/Ccm) from the
# Catcrafts fp6-img 0.7.2 tuning file (aports/temp/libcamera/imx896.yaml,
# r10), which documents where each number comes from: black level measured
# on the phone (10-bit pedestal 64 -> 4096 on the 16-bit scale), colour
# gains and CCMs read out of the stock FP6 tuning data, bright zone.
#
# colourGains doubles as the white point locus for the downstream clampMargin
# / zoneGating keys (patch 0008). The 0.7.2 damping key is gone: libipa's AWB
# does its own smoothing. The fluorescent points stay off the locus;
# clampMargin 0.35 admits them.
#
# PROVENANCE / LICENSE: as in the original file; NOT marked CC0.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
      algorithm: grey
      colourGains:
        - { ct: 1900, gains: [ 0.878997, 4.771635 ] }
        - { ct: 2300, gains: [ 1.119141, 3.340533 ] }
        - { ct: 2856, gains: [ 1.377957, 2.769483 ] }
        - { ct: 5000, gains: [ 2.037341, 1.809127 ] }
        - { ct: 6504, gains: [ 2.367133, 1.574040 ] }
        - { ct: 7504, gains: [ 2.741927, 1.357219 ] }
        - { ct: 9500, gains: [ 4.508486, 1.012164 ] }
      clampMargin: 0.35
      zoneGating: true
  - Ccm:
      ccms:
        - ct: 2800
          ccm: [ 1.593410, -0.552769, -0.040641,
                -0.166429,  1.170414, -0.003985,
                 0.004114, -0.855526,  1.851411 ]
        - ct: 4000
          ccm: [ 1.612519, -0.785270,  0.172751,
                -0.110672,  1.189965, -0.079293,
                 0.091939, -0.965137,  1.873197 ]
        - ct: 5750
          ccm: [ 1.900000, -0.581250, -0.318750,
                -0.292500,  1.778126, -0.485626,
                 0.014573, -0.734843,  1.720270 ]
  - Adjust:
  - Agc:
  - Af:
...
